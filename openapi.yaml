  /encounters/{encounter_id}/twin:
    get:
      operationId: getPatientTwin
      summary: อ่าน Digital Twin รายผู้ป่วย
      tags:
      - Screens
      description: One screen payload. Snapshot is server time; measurement and risk
        times stay separate. Derive freshness at read time so an old ready score is
        never presented as current. Internal modules compute features and inference;
        the UI does not submit probabilities. Nurse/admin, ward-scoped.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Twin'
              example:
                snapshot_at: '2026-10-22T23:10:00Z'
                encounter:
                  encounter_id: ENC-001
                  an: DEMO-2026-001
                  ward_id: WARD-A
                  bed_label: A-12

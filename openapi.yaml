openapi: 3.0.3
info:
  title: WARD TWIN Pilot API
  version: 1.0.0-draft
  description: Proposed API contract for one Python/FastAPI service, PostgreSQL storage
    and OutSystems ODC screens. Contract only; no running backend is included. Numeric
    examples are synthetic, not validated clinical thresholds. See api-spec-th.html
    for authorization, ingestion, model-time and CSV rules.
servers:
- url: http://localhost:8000/api/v1
  description: Local development; use HTTPS in hosted environments
security:
- UserBearer: []
tags:
- name: Screens
- name: Observations
- name: Workflow
- name: Agent
- name: Imports
- name: Operations
paths:
  /observations:
    post:
      operationId: ingestObservations
      summary: รับค่าวัดจากเกตเวย์หรือพยาบาล
      tags:
      - Observations
      description: GatewayKey permits source=iot and only heart_rate/respiratory_rate/spo2
        from its allowed devices. UserBearer permits source=manual in an authorized
        ward. A reading is identified by (authenticated producer_id, reading_id).
        Exact retries are no-ops; changed content is 409. Validate the whole batch,
        then commit atomically. Reject unmapped/ambiguous device assignments (409),
        naive timestamps, duplicate metrics, unknown fields and measured_at > server
        now+5 minutes (422). Late measurements are stored with their own measured_at
        and server received_at; they cannot rewrite a historical prediction. Maximum
        decoded body 1 MiB.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationReceipt'
              example:
                inserted_readings: 1
                duplicate_readings: 0
                received_at: '2026-10-22T23:09:02Z'
                items:
                - reading_id: 11111111-1111-4111-8111-111111111111
                  encounter_id: ENC-001
                  result: inserted
                prediction_processing: pending
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '500':
          $ref: '#/components/responses/500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationBatch'
            examples:
              iot-request:
                value:
                  source: iot
                  readings:
                  - reading_id: 11111111-1111-4111-8111-111111111111
                    device_id: MON-01
                    measured_at: '2026-10-22T23:09:00Z'
                    measurements:
                    - metric: heart_rate
                      value: 108
                      unit: bpm
                    - metric: respiratory_rate
                      value: 24
                      unit: breaths/min
                    - metric: spo2
                      value: 94
                      unit: '%'
              manual-request:
                value:
                  source: manual
                  readings:
                  - reading_id: 22222222-2222-4222-8222-222222222222
                    encounter_id: ENC-001
                    measured_at: '2026-10-22T22:45:00Z'
                    measurements:
                    - metric: systolic_bp
                      value: 106
                      unit: mmHg
                    - metric: diastolic_bp
                      value: 68
                      unit: mmHg
      security:
      - GatewayKey: []
      - UserBearer: []
      x-mvp-required: true

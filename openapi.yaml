  /imports:
    post:
      operationId: previewCsvImport
      summary: อัปโหลด CSV เพื่อตรวจและดูตัวอย่าง
      tags:
      - Imports
      description: Admin in ward only. Always dry-run. multipart/form-data with kind,
        ward_id and file; never write live readings/outcomes yet. Max file 2 MiB,
        5000 data rows, UTF-8 with optional BOM, comma-separated, Headers on physical
        row1, match the template set after trimming whitespace (column order may differ),
        no duplicate/unknown columns. Ignore empty physical lines but validate delimiter-only
        data rows. birth_date may be empty when unknown; preserve an already known
        birth date. UUID reading_ids are case-insensitive. An existing reading_id
        must be replayed with the exact complete metric set, never add/remove a metric.
        Preserve fractional-second precision when comparing timestamps. Stage immutable
        normalized rows in PostgreSQL with 24h expiry; no local-disk dependency on
        Render. Return 201 even if CSV has invalid rows (state=invalid); unreadable/structurally
        invalid CSV is 422. Preview max5 rows, errors max100 and report truncation.
        Historical outcomes are isolated from inference.

                  status: unacknowledged
                  owner_id: NURSE-A
                  owner_display_name: พยาบาลเวร A
                data_quality: &id003
                  status: fresh
                  last_iot_received_at: '2026-10-22T23:09:02Z'
                  issues: []
                  freshness_policy_version: pilot-policy-001
                vitals: &id004
                - metric: heart_rate
                  value: 108
                  unit: bpm
                  measured_at: '2026-10-22T23:09:00Z'
                  received_at: '2026-10-22T23:09:02Z'
                  source: iot
                  data_status: fresh
                  reading_id: 11111111-1111-4111-8111-111111111111
                - metric: respiratory_rate
                  value: 24
                  unit: breaths/min
                  measured_at: '2026-10-22T23:09:00Z'
                  received_at: '2026-10-22T23:09:02Z'
                  source: iot
                  data_status: fresh
                  reading_id: 11111111-1111-4111-8111-111111111111
                - metric: spo2
                  value: 94
                  unit: '%'
                  measured_at: '2026-10-22T23:09:00Z'
                  received_at: '2026-10-22T23:09:02Z'
                  source: iot
                  data_status: fresh
                  reading_id: 11111111-1111-4111-8111-111111111111
                - metric: systolic_bp
                  value: 106

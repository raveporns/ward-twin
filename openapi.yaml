  /imports/{import_id}/commit:
    post:
      operationId: commitCsvImport
      summary: ยืนยันนำเข้า CSV ที่ผ่านการตรวจ
      tags:
      - Imports
      description: No request body. Only uploading admin. Revalidate references, permissions
        and conflicts inside the same transaction and commit the exact staged rows
        atomically. Invalid state or changed target data=409 with REVALIDATION_REQUIRED;
        import again to preview a new draft. Expired draft=410. Never silently overwrite
        differing existing data; identical duplicates are no-ops. Repeated commit
        of an already committed import returns the original result. Outcomes only
        enter the isolated offline table. New historical imports do not emit retrospective
        live alerts.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCommit'
              example:
                import_id: IMP-001
                state: committed
                inserted_rows: 1
                duplicate_rows: 0
                committed_at: '2026-10-22T23:11:00Z'
